# Only what the Edge Function deploy needs. The database is managed through supabase/migrations.
project_id = "rtc-rentals"

[functions.ozow-pay]
verify_jwt = true

[functions.ozow-notify]
# Ozow calls this directly; it checks Ozow's signature itself.
verify_jwt = false

[functions.ozow-check]
verify_jwt = true

[functions.ozow-reconcile]
# Called on a schedule with the public anon key; throttled and returns counts only.
verify_jwt = true

[functions.autopay-setup]
verify_jwt = true
[functions.autopay-check]
verify_jwt = true
[functions.autopay-run]
verify_jwt = true
[functions.rent-reminders]
verify_jwt = true
