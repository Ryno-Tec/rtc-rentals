name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Database schema tests (Postgres 16)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
          sudo -u postgres env PATH=/usr/lib/postgresql/16/bin:$PATH bash -c 'cp -r "$GITHUB_WORKSPACE" /tmp/repo && /tmp/repo/tests/db/run.sh'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Browser smoke test (demo mode)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python tests/ui/smoke_test.py

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/ui/screenshots/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No AZURE_STATIC_WEB_APPS_API_TOKEN secret yet, so nothing was deployed. See README → Deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write public Supabase settings
        if: steps.token.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            cat > web/js/config.js <<EOF
          export const config = {
            supabaseUrl: '${SUPABASE_URL}',
            supabaseAnonKey: '${SUPABASE_ANON_KEY}',
          };
          EOF
          else
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY variables not set; deploying in demo mode."
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.token.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
