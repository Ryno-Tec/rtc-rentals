name: Test and deploy

# Every push to main: tests → staging (database, functions, site) → staging smoke tests →
# production (backup if the database changes, database, functions, site) → production smoke tests.
# Production only starts when staging passed. If production's smoke tests fail, the site is put
# back to the last version that passed (database changes are fixed forward, never undone).
# Staging runs once the STAGING_ENABLED repository variable is 'true' (see docs/DEVOPS.md);
# until then production deploys straight after the tests, as before.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Database schema tests (Postgres)
        run: |
          # The runner image ships PostgreSQL binaries; install them only if missing.
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          fi
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          postgres --version
          bash tests/db/run.sh

      - name: Ozow signing and web unit tests
        run: for t in tests/ozow/*.test.mjs tests/web/*.test.mjs; do node "$t"; done

      - name: Deploy script checks
        run: bash -n scripts/devops/*.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Browser smoke test (demo mode)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python tests/ui/smoke_test.py
          python tests/ui/docs_test.py
          python tests/ui/maintenance_test.py
          python tests/ui/lock_test.py
          python tests/ui/features_test.py
          python tests/ui/billing_test.py
          python tests/ui/agency_test.py

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/ui/screenshots/

  # ------------------------------------------------------------------ staging
  staging:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ vars.STAGING_SITE_URL }}
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      # Staging settings use their own names so a missing value can never fall back to production's.
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.STAGING_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SITE_URL: ${{ vars.STAGING_SITE_URL }}
      KHAPHELA_KEY: ${{ secrets.STAGING_KHAPHELA_KEY }}
      PROD_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure this is the staging project
        run: |
          source scripts/devops/lib.sh
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_DB_URL" ] && [ -n "$SITE_URL" ] \
            || fail "Staging is enabled but STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_SITE_URL or STAGING_DB_URL is missing."
          [ "$(project_ref "$SUPABASE_URL")" != "$(project_ref "$PROD_SUPABASE_URL")" ] || fail "Staging points at the production Supabase project."
          case "$SUPABASE_DB_URL" in *"$(project_ref "$PROD_SUPABASE_URL")"*) fail "STAGING_DB_URL points at the production database.";; esac

      - name: Database migrations
        run: bash scripts/devops/migrate.sh

      - name: Server functions
        run: bash scripts/devops/deploy-functions.sh

      - name: Site settings
        run: bash scripts/devops/write-config.sh staging

      - name: Publish staging site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STAGING_SWA_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true

      - name: Smoke tests (staging)
        run: bash scripts/devops/smoke.sh "$SITE_URL"

  # --------------------------------------------------------------- production
  backend:
    needs: [test, staging]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.test.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SITE_URL: https://rentals.ryno-tec.co.za
      RTC_OZOW_SITE_CODE: ${{ secrets.RTC_OZOW_SITE_CODE }}
      RTC_OZOW_CLIENT_ID: ${{ secrets.RTC_OZOW_CLIENT_ID }}
      RTC_OZOW_CLIENT_SECRET: ${{ secrets.RTC_OZOW_CLIENT_SECRET }}
      RTC_OZOW_PRIVATE_KEY: ${{ secrets.RTC_OZOW_PRIVATE_KEY }}
      RTC_OZOW_API_KEY: ${{ secrets.RTC_OZOW_API_KEY }}
      RTC_OZOW_IS_TEST: ${{ vars.RTC_OZOW_IS_TEST }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      KHAPHELA_KEY: ${{ secrets.KHAPHELA_KEY }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Pending database changes
        id: pending
        run: |
          DRY_RUN=true bash scripts/devops/migrate.sh
          echo "count=$(wc -l < /tmp/pending-migrations | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Backup before changing the database
        if: steps.pending.outputs.count != '0'
        run: |
          source scripts/devops/lib.sh
          [ -n "$AGE_RECIPIENT" ] || fail "BACKUP_AGE_RECIPIENT is not set; refusing to change the production database without a backup."
          install_pg17; install_age
          mkdir -p /tmp/pre && pg_dump "$SUPABASE_DB_URL" -Fc --no-owner --no-acl -f /tmp/pre/db.dump
          pg_restore --list /tmp/pre/db.dump > /dev/null
          age -r "$AGE_RECIPIENT" -o "/tmp/pre/rtc-rentals-pre-migration-${GITHUB_SHA::7}.dump.age" /tmp/pre/db.dump && rm /tmp/pre/db.dump

      - name: Keep the pre-change backup (encrypted)
        if: steps.pending.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pre-migration-backup-${{ github.sha }}
          path: /tmp/pre/*.age
          retention-days: 30

      - name: Database migrations
        run: bash scripts/devops/migrate.sh

      - name: Server functions
        run: bash scripts/devops/deploy-functions.sh

  web:
    needs: backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Android app link (Google Play / AppGallery)
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: bash scripts/devops/assetlinks.sh
      - name: Site settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: bash scripts/devops/write-config.sh production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  smoke:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests (production)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          KHAPHELA_KEY: ${{ secrets.KHAPHELA_KEY }}
        run: bash scripts/devops/smoke.sh https://rentals.ryno-tec.co.za

  mark-good:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remember this version as the last good production release
        run: git tag -f prod-good && git push -f origin prod-good

  rollback:
    needs: [web, smoke]
    if: failure() && needs.web.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Go back to the last good release
        run: |
          if git rev-parse -q --verify refs/tags/prod-good >/dev/null; then
            echo "::warning::Production smoke tests failed; putting the site back to $(git rev-parse --short prod-good)."
            git checkout -q prod-good
          else
            echo "::error::Production smoke tests failed and there is no earlier good release to go back to."; exit 1
          fi
      - name: Android app link
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: '[ -f scripts/devops/assetlinks.sh ] && bash scripts/devops/assetlinks.sh || true'
      - name: Site settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -f scripts/devops/write-config.sh ]; then bash scripts/devops/write-config.sh production
          else printf "export const config = {\n  supabaseUrl: '%s',\n  supabaseAnonKey: '%s',\n};\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > web/js/config.js; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report
        run: echo "::error::Production was rolled back. Fix forward on main; the failed smoke test log is in the smoke job."; exit 1
