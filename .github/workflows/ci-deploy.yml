name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Database schema tests (Postgres)
        run: |
          # The runner image ships PostgreSQL binaries; install them only if missing.
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          fi
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          postgres --version
          bash tests/db/run.sh

      - name: Ozow signing tests
        run: node tests/ozow/ozow.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Browser smoke test (demo mode)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python tests/ui/smoke_test.py
          python tests/ui/docs_test.py
          python tests/ui/maintenance_test.py
          python tests/ui/lock_test.py
          python tests/ui/features_test.py
          python tests/ui/billing_test.py

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/ui/screenshots/

  functions:
    # Deploys the Ozow server functions to Supabase. Skipped until the SUPABASE_ACCESS_TOKEN secret exists.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      RTC_OZOW_SITE_CODE: ${{ secrets.RTC_OZOW_SITE_CODE }}
      RTC_OZOW_CLIENT_ID: ${{ secrets.RTC_OZOW_CLIENT_ID }}
      RTC_OZOW_CLIENT_SECRET: ${{ secrets.RTC_OZOW_CLIENT_SECRET }}
      RTC_OZOW_IS_TEST: ${{ vars.RTC_OZOW_IS_TEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Ozow functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set; server functions not deployed."; exit 0
          fi
          REF="$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')"
          echo "Project: $REF"
          npx -y supabase@latest functions deploy ozow-pay --yes --project-ref "$REF" --use-api
          npx -y supabase@latest functions deploy ozow-notify --yes --project-ref "$REF" --no-verify-jwt --use-api
          npx -y supabase@latest functions deploy ozow-check --yes --project-ref "$REF" --use-api
          # Ryno-Tec's own Ozow account (for owners paying invoices). The return address defaults to
          # rentals.ryno-tec.co.za; RTC_OZOW_IS_TEST=true only for Ozow staging credentials.
          if [ -n "$RTC_OZOW_SITE_CODE" ] && [ -n "$RTC_OZOW_CLIENT_ID" ] && [ -n "$RTC_OZOW_CLIENT_SECRET" ]; then
            npx -y supabase@latest secrets set --yes --project-ref "$REF" \
              "RTC_OZOW_SITE_CODE=$RTC_OZOW_SITE_CODE" "RTC_OZOW_CLIENT_ID=$RTC_OZOW_CLIENT_ID" "RTC_OZOW_CLIENT_SECRET=$RTC_OZOW_CLIENT_SECRET" "RTC_OZOW_IS_TEST=${RTC_OZOW_IS_TEST:-false}"
          else
            echo "::notice::Ryno-Tec Ozow secrets not set yet; invoices can be paid by EFT until then."
          fi

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Android app link (Google Play / AppGallery)
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          # Proves to Android that the store app and this website belong together, so the app
          # opens full-screen without a browser bar. Set the repo variable once the signing key exists.
          if [ -n "$ANDROID_CERT_SHA256" ]; then
            mkdir -p web/.well-known
            FPS=$(echo "$ANDROID_CERT_SHA256" | tr ',' '\n' | sed -E 's/^ *//; s/ *$//' | sed -E 's/.*/"&"/' | paste -sd, -)
            printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"za.co.rynotec.rentals","sha256_cert_fingerprints":[%s]}}]\n' "$FPS" > web/.well-known/assetlinks.json
            cat web/.well-known/assetlinks.json
          fi

      - name: Write public Supabase settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # Accept the URL with or without the /rest/v1/ path the dashboard sometimes shows.
          SUPABASE_URL="$(echo "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#/rest/v1/?$##; s#/+$##')"
          SUPABASE_ANON_KEY="$(echo "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          echo "Supabase project: $SUPABASE_URL"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            cat > web/js/config.js <<EOF
          export const config = {
            supabaseUrl: '${SUPABASE_URL}',
            supabaseAnonKey: '${SUPABASE_ANON_KEY}',
          };
          EOF
          else
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY variables not set; deploying in demo mode."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
