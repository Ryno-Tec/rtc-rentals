name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Database schema tests (Postgres)
        run: |
          # The runner image ships PostgreSQL binaries; install them only if missing.
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          fi
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          postgres --version
          bash tests/db/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Browser smoke test (demo mode)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python tests/ui/smoke_test.py

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/ui/screenshots/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Write public Supabase settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # Accept the URL with or without the /rest/v1/ path the dashboard sometimes shows.
          SUPABASE_URL="$(echo "$SUPABASE_URL" | sed -E 's#/rest/v1/?$##; s#/+$##')"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            cat > web/js/config.js <<EOF
          export const config = {
            supabaseUrl: '${SUPABASE_URL}',
            supabaseAnonKey: '${SUPABASE_ANON_KEY}',
          };
          EOF
          else
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY variables not set; deploying in demo mode."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
