name: Automatic payments and reminders

# Hourly: bring Capitec Pay approvals up to date, collect rent that is due on active automatic
# payments, record results, pass cancellations to Ozow. Daily 07:05 SA time: rent reminder emails.
# The server functions throttle themselves and only act on what the database says is due.
on:
  schedule:
    - cron: '23 * * * *'
    - cron: '5 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Run
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          REMINDERS: ${{ github.event.schedule == '5 5 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          URL="$(echo "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#/rest/v1/?$##; s#/+$##')"
          KEY="$(echo "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          call() { curl -sS --fail-with-body -X POST "$URL/functions/v1/$1" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}'; echo; }
          call autopay-run
          if [ "$REMINDERS" = "true" ]; then call rent-reminders; fi
